repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.8.0"
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix, --config=pyproject.toml]
      # Run the formatter.
      - id: ruff-format
        args: [--config=pyproject.toml]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        exclude: ^tests/
        additional_dependencies:
          - rdkit-stubs
          - nerdd-module
          - nerdd-link
          - pydantic
          - fastapi
          - hydra-core
          - omegaconf
          - uvicorn
          - scikit-learn
          - types-requests
          - altcha~=0.1.9
          - websockets
        args: [--config-file=pyproject.toml]
