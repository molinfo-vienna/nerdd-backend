[build-system]
requires = ["setuptools>=62", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nerdd-backend"
version = "0.5.64"
description = "Web service for NERDD, a machine-learning platform for cheminformatics"
authors = [{ name = "Steffen Hirte", email = "steffen.hirte@univie.ac.at" }]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["fastapi", "backend", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "nerdd-module>=0.3.59",
    "nerdd-link>=0.6",
    "fastapi~=0.116.0",
    "uvicorn[standard]~=0.23.2",
    "aiokafka~=0.12.0",
    "rethinkdb~=2.4.10.post1",
    "python-multipart~=0.0.6",
    "hydra-core>=1.3.2",
    "altcha~=0.1.9",
    "scikit-learn>=1.7.1",
    "requests>=2",
    # for older python versions:
    "importlib-resources>=5; python_version<'3.9'",
    "importlib-metadata>=4.6; python_version<'3.10'",
]

[project.optional-dependencies]
dev = ["mypy>=1.10.0", "ruff", "pre-commit>=2", "ipykernel~=6.19.4"]
test = [
    "pytest",
    "pytest-watcher",
    "pytest-cov",
    "pytest-bdd==7.3.0",
    "pytest-mock",
    "pytest-asyncio~=0.21.1",
    "hypothesis",
    "hypothesis-rdkit",
    "httpx~=0.25.1",
    "asgi_lifespan~=2.1.0",
]

#
# TOOLS
#
[tool.setuptools.packages.find]
where = ["."]
include = ["nerdd_backend*"]

[tool.setuptools.package-data]
nerdd_module = ["py.typed"]

[tool.ruff]
line-length = 100
extend-exclude = ["tests", "nerdd_backend/tests"]
# enable preview / unstable version for fastapi rules
preview = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "S",    # flake8-bandit
    "RUF",  # Ruff-specific rules
    "FAST", # FastAPI rules
    "T20",  # no print statements
]
ignore = [
    "F403",   # I often use 'from .submodule import *' in __init__.py files
    "C408",   # I prefer dict(a=5) over {'a': 5}
    "S101",   # Assertions establish internal invariants in repository implementations
    "S104",   # The application is deliberately configurable to listen on all interfaces
    "SIM105", # Explicit try/except blocks make ignored database errors clearer
    "SIM108", # Ternary expressions are not always more readable
    "TCH001", # Application types are used at runtime through FastAPI application state
    "TCH002", # Third-party types are used at runtime through FastAPI application state
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    # Whitelisted default arguments
    "fastapi.Body",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Depends",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
exclude = ["^tests/*"]
# no_implicit_optional = True
# check_untyped_defs = True
# show_error_codes = True

[[tool.mypy.overrides]]
module = [
    "rdkit.*",
    "nerdd_module.*",
    "rethinkdb.*",
    "sklearn.*",
    "stringcase.*",
]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
log_cli = 1
log_cli_level = "INFO"
addopts = "-x --cov-report term --cov=nerdd_backend"

[tool.pytest-watcher]
patterns = ["*.py", "*.feature", "pyproject.toml"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
upload_to_vcs_release = true
